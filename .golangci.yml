# Reference .golangci.yml for klarlabs-studio Go repos (golangci-lint v2).
# Copy to a repo's root as `.golangci.yml`. gocritic is part of the bar —
# keep it enabled. Add repo-specific exclusions under `exclusions.rules`.
version: "2"

run:
  timeout: 5m

linters:
  # Mandatory org bar. gocritic is non-negotiable. Code-level security is
  # owned by nox (taint-analysis plugin + core ruleset), not gosec.
  # gocyclo/dupl are intentionally NOT here — noisy and repo-specific; opt
  # in per repo if a codebase wants them, not part of the shared gate.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic     # org engineering bar — do not drop

  # node_modules is third-party code that happens to ship .go files — the
  # `flatted` npm package vendors a Go implementation, and linting it failed
  # this repo's push gate on two govet findings in code nobody here wrote.
  # docs/node_modules IS gitignored, but golangci-lint does not read
  # .gitignore, so ignoring it in git does not keep it out of ./...
  exclusions:
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
