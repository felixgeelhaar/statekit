<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1c2128" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="url(#grid)" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- logo -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="72" height="72" rx="14" stroke="#adbac7" stroke-width="3" fill="none"/>
    <circle cx="22" cy="22" r="8" fill="#00d4ff"/>
    <circle cx="50" cy="22" r="8" fill="#a855f7"/>
    <circle cx="36" cy="50" r="8" fill="#00ff88"/>
    <line x1="28" y1="22" x2="44" y2="22" stroke="#00d4ff" stroke-width="3"/>
    <line x1="22" y1="28" x2="36" y2="44" stroke="#00d4ff" stroke-width="3"/>
    <line x1="50" y1="28" x2="36" y2="44" stroke="#a855f7" stroke-width="3"/>
  </g>
  <text x="172" y="135" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" fill="#e6edf3">Statekit</text>

  <!-- headline -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" fill="#e6edf3">Statecharts for Go.</text>
  <text x="80" y="360" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" fill="#00d4ff">Type-safe. Hierarchical. Visualizable.</text>

  <!-- pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" font-weight="500">
    <rect x="80" y="430" width="240" height="46" rx="23" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1"/>
    <text x="200" y="460" text-anchor="middle" fill="#00d4ff">Hierarchical states</text>

    <rect x="340" y="430" width="220" height="46" rx="23" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1"/>
    <text x="450" y="460" text-anchor="middle" fill="#a855f7">Parallel regions</text>

    <rect x="580" y="430" width="200" height="46" rx="23" fill="rgba(0,255,136,0.12)" stroke="#00ff88" stroke-width="1"/>
    <text x="680" y="460" text-anchor="middle" fill="#00ff88">Visualization</text>

    <rect x="800" y="430" width="190" height="46" rx="23" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1"/>
    <text x="895" y="460" text-anchor="middle" fill="#00d4ff">FakeClock</text>

    <rect x="1010" y="430" width="110" height="46" rx="23" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1"/>
    <text x="1065" y="460" text-anchor="middle" fill="#a855f7">Lint</text>
  </g>

  <!-- code line -->
  <text x="80" y="540" font-family="'JetBrains Mono', monospace" font-size="22" fill="#6e7781">$</text>
  <text x="105" y="540" font-family="'JetBrains Mono', monospace" font-size="22" fill="#e6edf3">go get go.klarlabs.de/statekit</text>

  <text x="80" y="585" font-family="'JetBrains Mono', monospace" font-size="18" fill="#6e7781">klarlabs-studio.github.io/statekit · v1.4.1 · MIT</text>
</svg>
