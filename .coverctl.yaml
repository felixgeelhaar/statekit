version: 1

policy:
  default:
    min: 80
  domains:
    - name: core
      match:
        - github.com/felixgeelhaar/statekit
      exclude:
        - ./internal/...
        - ./export/...
        - ./examples/...
        - ./statetest/...
        - ./debug/...
        - ./lint/...
      min: 85
    - name: ir
      match:
        - ./internal/ir/...
      min: 90
    - name: export
      match:
        - ./export/...
      min: 75
    - name: statetest
      match:
        - ./statetest/...
      min: 80
    - name: debug
      match:
        - ./debug/...
      min: 85
    - name: metrics
      match:
        - ./metrics/...
      min: 90
    - name: health
      match:
        - ./health/...
      min: 90
    - name: lint
      match:
        - ./lint/...
      min: 85
