name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires this workflow's status
    # checks (ci / Lint, Test, Build, Security (nox)), and a docs-only PR that
    # skips the whole workflow never reports them — so the PR is unmergeable
    # forever without an admin override. Running CI on docs PRs is cheap (no Go
    # code changed → cache hits) and keeps them mergeable; the push-to-main
    # trigger above still skips docs, saving minutes on merges.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      cross-platform: false   # pure-logic lib; ubuntu is sufficient
