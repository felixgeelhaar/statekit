name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Install nox
        # nox/cli@v0.8.1 requires a newer Go toolchain than go.mod pins; allow
        # `go install` to fetch the matching toolchain instead of failing under
        # GOTOOLCHAIN=local.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/nox-hq/nox/cli@v0.8.1
          mv "$(go env GOPATH)/bin/cli" "$(go env GOPATH)/bin/nox"

      - name: Generate release SBOM
        # nox scan exits non-zero when findings exist (even baselined ones in a
        # source-built binary). SBOM generation should not gate on findings —
        # the security CI job already enforces that — so tolerate the exit code
        # and verify the artifacts were written.
        run: |
          mkdir -p release-artifacts
          nox -format cdx,spdx -output release-artifacts scan . || true
          test -s release-artifacts/sbom.cdx.json
          test -s release-artifacts/sbom.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/sbom.cdx.json
            release-artifacts/sbom.spdx.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
