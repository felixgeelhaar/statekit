# Reference .golangci.yml for klarlabs-studio Go repos (golangci-lint v2).
# Copy to a repo's root as `.golangci.yml`. gocritic is part of the bar —
# keep it enabled. Add repo-specific exclusions under `exclusions.rules`.
version: "2"

run:
  timeout: 5m

linters:
  # Mandatory org bar. gocritic is non-negotiable. Code-level security is
  # owned by nox (taint-analysis plugin + core ruleset), not gosec.
  # gocyclo/dupl are intentionally NOT here — noisy and repo-specific; opt
  # in per repo if a codebase wants them, not part of the shared gate.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic     # org engineering bar — do not drop

  exclusions:
    # node_modules is not our code and is not even in git, but golangci-lint
    # walks the filesystem rather than the module graph: one `npm install` in a
    # docs or web subdirectory is enough for a stray vendored .go file inside a
    # package to start failing this repo's gate. Observed exactly that from
    # docs/node_modules/flatted/golang/.
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
